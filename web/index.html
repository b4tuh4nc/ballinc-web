<!DOCTYPE html>
<html lang="tr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballinc — Futbol Tahmin</title>
<meta name="description" content="Beş Avrupa ligi ve Süper Lig için xG tabanlı maç tahminleri.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#0b7d51">
<meta property="og:title" content="Ballinc — Futbol Tahmin">
<meta property="og:description" content="Altı ligde xG tabanlı maç tahminleri. Modelin geriye dönük ölçümü açıkça yayınlanır.">
<meta property="og:image" content="https://ballinc.batuhanciftci.com/assets/logo-512.png">
<meta property="og:url" content="https://ballinc.batuhanciftci.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="style.css?v=d44420df66">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <button id="menu-btn" class="icon-btn menu-btn" type="button"
            aria-label="Ligler menüsü" aria-expanded="false" aria-controls="drawer">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <a class="brand" href="#/">
      <img class="brand-mark" src="assets/logo.png" alt="" width="26" height="26">
      <span class="brand-text">Ballinc</span>
    </a>
    <nav class="leagues" id="league-nav" aria-label="Ligler"></nav>
    <!-- Kaydırılan lig şeridinin DIŞINDA: dar ekranda şeridin sonunda
         kalınca görünmüyordu ve on dört yarışmaya ulaşmanın tek yolu oydu. -->
    <div id="more-leagues"></div>
    <button id="search-btn" class="icon-btn" type="button"
            aria-label="Takım ara" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <button id="notify-toggle" class="icon-btn" type="button"
            aria-label="Favori takım bildirimleri" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    </button>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Temayı değiştir">
      <span aria-hidden="true">◐</span>
    </button>
  </div>

  <!-- "Diğer ligler" panelinin yeri. Üst çubuğun içinde duruyor ki üstten
       iner gibi açılsın; çubuk sticky olduğu için de sayfa kayarken
       hizasını koruyor. -->
  <div id="more-panel" class="more-panel" hidden aria-label="Diğer ligler"></div>
</header>
<div id="more-scrim" class="more-scrim" hidden></div>
<!-- Lig filtresi #view'in DISINDA: içinde olunca sayfa geçiş animasyonunun
     yarattığı yığınlama bağlamına hapsoluyor ve maç listesi üstüne biniyor. -->
<div id="filter-host"></div>

<div id="scrim" class="scrim" hidden></div>
<div id="search-scrim" class="search-scrim" hidden></div>
<div id="search" class="search-modal" hidden role="dialog" aria-label="Takım ara">
  <div class="search-head">
    <input id="search-input" type="search" placeholder="Takım ara…"
           autocomplete="off" spellcheck="false" aria-label="Takım adı">
    <button id="search-close" class="icon-btn" type="button" aria-label="Kapat">✕</button>
  </div>
  <div id="search-results" class="search-results"></div>
</div>
<aside id="drawer" class="drawer" hidden aria-label="Ligler">
  <div class="drawer-head">
    <span>Ligler</span>
    <button id="drawer-close" class="icon-btn" type="button" aria-label="Kapat">✕</button>
  </div>
  <nav id="drawer-nav"></nav>
</aside>

<main id="view" class="wrap" aria-live="polite">
  <div class="loading">Yükleniyor…</div>
</main>

<footer class="footer">
  <div class="wrap">
    <p>
      Tahminler xG tabanlı bir gol beklentisi modelinden üretilir ve
      <a href="#/model">geriye dönük ölçümü açıkça yayınlanır</a>.
      Maç saatleri Türkiye saatidir.
    </p>
    <p class="muted" id="generated-at"></p>
    <p class="muted">Bilgi amaçlıdır, bahis tavsiyesi değildir. 18+</p>
  </div>
</footer>

<script src="app.js?v=15c8994cf0"></script>
</body>
</html>
