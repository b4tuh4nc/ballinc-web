# Maç detayı taraması: xG, kadro piyasa değeri, ilk 11 yaşı, teknik direktör.
# 2022/23'ten bugüne ~21.700 maç var, istek başına yarım saniye beklendiği
# için iş parçalara bölünüyor. Önbellek repoda durduğu ve her maç bir kez
# istendiği için bu iş akışı tamamlanana kadar tekrar tekrar çalıştırılabilir.
name: Maç detaylarını çek
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Bu çalıştırmadaki azami istek"
        default: "7000"
      since:
        description: "Bu sezondan eskisi taranmasın"
        default: "2022_2023"
      leagues:
        description: "Yalnızca bu yarışmalar (boşluklu; boş = hepsi)"
        default: ""

permissions:
  contents: write

jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Güncel sezonların ham verisi repoda tutulmuyor.
      - run: python -m pipeline.ingest

      # Lig listesi YAML ifadesiyle değil kabukta ekleniyor. İfadeli hali
      # sessizce boş üretmişti: paralel çalıştırılan dört parça da bütün
      # ligleri taramaya kalktı, yani aynı işi dört kez yaptılar.
      - env:
          LEAGUES: ${{ inputs.leagues }}
          BUDGET: ${{ inputs.budget }}
          SINCE: ${{ inputs.since }}
        run: |
          ARGS="--budget $BUDGET --since $SINCE --xg-first"
          if [ -n "$LEAGUES" ]; then
            ARGS="$ARGS --leagues $LEAGUES"
          fi
          echo "komut: python -m pipeline.details $ARGS"
          python -m pipeline.details $ARGS

      - name: İşle
        if: always()
        run: |
          git config user.name "ballinc-bot"
          git config user.email "actions@github.com"
          git add -f data/details
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "Maç detayları: tarama parçası"
          # Parçalar paralel çalışıyor ve hepsi aynı dala yazıyor. İlk push'un
          # reddedilmesi beklenen bir durum, hata değil.
          for i in 1 2 3 4 5 6; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push $i. denemede olmadı, tekrar..."
            sleep $((RANDOM % 20 + 5))
          done
          echo "push başarısız"; exit 1
