name: Siteyi yayınla

# Veri akışı (update.yml) gecelik çalışıp sonunda yayınlıyor. Ama arayüz
# değişiklikleri push ile geliyor ve o akışı beklemek zorunda kalıyordu —
# kod gönderildiği halde sitede hiçbir şey değişmiyordu. Bu workflow yalnızca
# web/ klasörünü yayınlar: veri çekmez, model eğitmez, saniyeler sürer.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# update.yml ile aynı grupta: ikisi aynı anda Pages'e yazmaya çalışmasın.
concurrency:
  group: ballinc-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tarayıcı önbelleği yüzünden kullanıcı eski CSS/JS görüyordu.
      - name: Varlıklara sürüm damgası bas
        run: python -m pipeline.stamp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
