name: Kaynak dosya adı taraması
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: new/ altındaki dosya adları
        run: |
          for C in CZE CZR CZH CRO CRT HRV ROU RUS SWE NOR FIN IRL ARG BRA; do
            CODE=$(curl -s -o /dev/null -m 20 -w "%{http_code}" "https://www.football-data.co.uk/new/$C.csv")
            echo "$C -> $CODE"
          done
      - name: Sayfadaki bağlantılar
        run: |
          curl -sS -m 30 https://www.football-data.co.uk/new_leagues_data.php \
            | grep -oiE 'new/[A-Z]+\.csv' | sort -u | tr '\n' ' '
          echo
