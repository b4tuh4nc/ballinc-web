name: Kaynak erişim testi
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: football-data.co.uk erişilebilir mi
        run: |
          for U in mmz4281/2526/E0.csv mmz4281/2526/T1.csv new/AUT.csv; do
            echo "── $U"
            curl -sS -m 25 -o /tmp/f.csv -w "  http=%{http_code} boyut=%{size_download}\n" \
              "https://www.football-data.co.uk/$U" || echo "  BASARISIZ"
            head -1 /tmp/f.csv | cut -c1-200
            echo
          done
