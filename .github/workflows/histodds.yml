# Tek seferlik / seyrek: geçmiş kapanış oranlarını indirip repoya yazar.
# football-data.co.uk Türkiye'den erişilemiyor (bağlantı zaman aşımı), bu
# yüzden indirme koşucuda yapılıyor. Biten sezonların oranı değişmediği için
# bu iş akışı zamanlanmıyor, elle tetikleniyor.
name: Geçmiş oranları çek
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  histodds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Güncel sezonların ham verisi repoda tutulmuyor; oran eşleştirmesi
      # için takım kimlikleri gerekiyor.
      - run: python -m pipeline.ingest

      - run: python -m pipeline.sources.histodds

      - name: İşle
        run: |
          git config user.name "ballinc-bot"
          git config user.email "actions@github.com"
          git add -f data/hist_odds.parquet
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Geçmiş kapanış oranları güncellendi"
            git pull --rebase --autostash origin main
            git push
          fi
