name: Veriyi güncelle ve yayınla

on:
  schedule:
    # Üç saatte bir. Gecede tek çalıştırmada, bugün oynanan maçlar ertesi
    # güne kadar puan durumuna ve sonuçlara girmiyordu; kullanıcı maç biter
    # bitmez bakıyor. (Zamanlanmış işler yoğun saatlerde gecikebiliyor,
    # dolayısıyla pratikte gecikme 3 saatten biraz fazla olabilir.)
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      backtest:
        description: "Backtest'i bu çalıştırmada da yap"
        type: boolean
        default: false

concurrency:
  group: ballinc-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Ham veri repoda tutulmuyor (her gece değiştiği için); her çalıştırmada
      # kaynaktan yeniden çekiliyor.
      - name: Veriyi çek
        run: python -m pipeline.ingest

      # Takım eşlemesi, logo ve hafta numarası için gerekli. --lenient:
      # yeni bir takım eşleşmezse akış durmasın, sadece o takım logosuz kalsın.
      - name: Takım eşlemesini tazele
        run: python -m pipeline.crosswalk --lenient

      - name: Hafta numaraları
        run: python -m pipeline.rounds

      - name: Logolar
        run: python -m pipeline.logos

      # Bütünlük kontrolü bilerek bloklayıcı: bozuk veri asla siteye
      # ulaşmasın, site son çalışan JSON'la ayakta kalsın.
      - name: Doğrula
        run: python -m pipeline.validate

      - name: Feature'ları üret
        run: python -m pipeline.features

      - name: Sızıntı testleri
        run: python -m pytest tests/ -q

      - name: Modeli eğit
        run: python -m pipeline.train

      # Backtest dakikalar sürüyor ve sonucu günlük olarak anlamlı
      # değişmiyor; pazartesileri ve elle tetiklendiğinde çalışıyor.
      - name: Backtest
        env:
          FORCE: ${{ github.event.inputs.backtest }}
        run: |
          # Haftada bir yeter: dakikalar sürüyor ve sonucu gün içinde
          # anlamlı değişmiyor. Pazartesi 01:00 UTC koşusunda çalışıyor.
          if { [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" = "01" ]; }              || [ "$FORCE" = "true" ]; then
            python -m pipeline.backtest
          else
            echo "Backtest atlandı (haftalık koşu değil)."
          fi

      # Oranlar ayrı adımda: servis çökerse ya da kota biterse site son
      # bilinen oranlarla çalışmaya devam eder.
      #
      # Günde iki kez çekiliyor. Ücretsiz kota ayda 500 istek ve her çekim
      # 6 lig = 6 kredi harcıyor; üç saatte bir çekseydik ayda ~1440 istekle
      # kota 11 günde biterdi. İki çekim ayda ~372 istek yapıyor ve akşam
      # maçlarından önceki oranları yakalıyor. Atlanan koşularda diskteki
      # son oranlar kullanılmaya devam ediyor.
      # Sıklık ve kota kararı market.py'nin içinde: burada saate bakan bir
      # kontrol vardı ("10 veya 16 ise çek") ama cron üç saatte bir
      # tetiklediği için o saatler hiç gelmiyordu ve oran çekimi ancak
      # GitHub'ın gecikmesi tesadüfen denk düşerse çalışıyordu.
      - name: Bahis oranları
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m pipeline.market

      - name: Siteyi üret
        run: python -m pipeline.export

      - name: Tahminleri kaydet ve sonuçlandır
        run: python -m pipeline.track

      - name: Değişiklikleri işle
        run: |
          git config user.name "ballinc-bot"
          git config user.email "actions@github.com"
          git add web/data web/assets models/metrics.json \
                  data/predictions.sqlite data/team_crosswalk.json \
                  data/market_odds.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Otomatik güncelleme: $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Günde sekiz koşu var; arada elle push yapılmış olabilir.
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Varlıklara sürüm damgası bas
        run: python -m pipeline.stamp

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
